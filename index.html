<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./assets/styles/header.css" />
  <link rel="stylesheet" href="./assets/styles/login.css" />
  <link rel="apple-touch-icon" href="./assets/images/icon/apple-touch-icon.png" />
  <link rel="shortcut icon" href="./assets/images/icon/favicon.ico" type="image/x-icon">
  <link rel="icon" href="./assets/images/icon/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="./assets/images/icon/favicon-32x32.png" sizes="32x32" type="image/png">
  <title>Login - Interseas</title>
  <meta name="description" content="ComexAI - Login">
  <script type="module">
    import { checkAuth } from "./assets/js/auth.js";

    const HOME_PAGE = 'home.html';

    await checkAuth({ redirectAuthenticated: true, authenticatedDestinationPage: HOME_PAGE });
  </script>
</head>

<body>
  <header>
    <img src="./flowise-embed/src/assets/logo.svg" alt="Interseas Logo" />
  </header>

  <div class="page">
    <div class="modal" id="loginModal">
      <div class="card">
        <img src="./assets/images/login-icon.png"  alt="loginimage">
        <h2 class="text-login">Login</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">E-mail</label>
            <input type="email" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div id="error-message" class="error-message"></div>
          <button type="submit" id="login-button" class="btn-login">CONFIRMAR</button>
          <div id="errorMessage" class="error-message">
            Credenciais inválidas. Tente novamente.
          </div>
        </form>
      </div>
    </div>
    <div class="background">
      <img src="./assets/images/login-background.jpeg" alt="agenteslogo">
    </div>
  </div>

  <script type="module">
    import { authenticate } from "./assets/js/auth.js";

    const handleFormData = (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const authenticated = authenticate(username, password);

      if (!authenticated) {
        document.getElementById('errorMessage').style.display = 'block';
      }
    };

    document.getElementById('loginForm').addEventListener('submit', handleFormData);
  </script>
</body>

</html>
