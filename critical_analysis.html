<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <link rel="apple-touch-icon" href="./assets/images/icon/apple-touch-icon.png" />
  <link rel="shortcut icon" href="./assets/images/icon/favicon.ico" type="image/x-icon">
  <link rel="icon" href="./assets/images/icon/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="./assets/images/icon/favicon-32x32.png" sizes="32x32" type="image/png">
  <title>Análise Pré-Embarque - Interseas</title>
  <script type="module">
    import { checkAuth } from "./assets/js/auth.js";

    await checkAuth({ redirectNotAuthenticated: true });

</head>

<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script type="module">
    import Chatbot from './flowise-embed/dist/web.js';
    import { menuItems } from './assets/js/data.js'

    const chatflowid = 'c59bb4ab-f777-496e-a500-697609e0ed8e';

    Chatbot.initMenu({
      currentFlow: 'critical_analysis',
      chatflowid: chatflowid,
      items: menuItems,
    });

    Chatbot.initFull({
      chatflowid: chatflowid,
      apiHost: 'https://ca-ai-interseas-prod-eastus2-001.ambitiouscliff-2460d16d.eastus2.azurecontainerapps.io',
      theme: {
        button: {
          backgroundColor: '#136FEE',
          right: 20,
          bottom: 20,
          size: 48,
          dragAndDrop: true,
          iconColor: 'white',
          autoWindowOpen: {
            autoOpen: false,
            openDelay: 2,
            autoOpenOnMobile: false,
          },
        },
        chatWindow: {
          showTitle: true,
          renderHTML: true,
          flow: 'critical_analysis',
          showAgentMessages: true,
          title: 'Análise Pré-Embarque',
          welcomeMessage: `Olá! Sou Comex AI, assistente de IA especializado em Análise Pré-Embarque de
          Importação.
          Para iniciarmos a análise envie uma mensagem preenchendo os campos abaixo ou faça
          o upload (ícone no canto inferior esquerdo da caixa de texto) de um documento
          contendo as informações`,
          errorMessage: 'This is a custom error message',
          backgroundColor: '#ffffff',
          backgroundImage: 'enter image path or link',
          fontSize: 16,
          starterPromptFontSize: 15,
          botMessage: {
            backgroundColor: '#ECECEC',
            textColor: '#303235',
            showAvatar: true,
          },
          userMessage: {
            backgroundColor: '#136FEE',
            textColor: '#ffffff',
          },
          textInput: {
            placeholder: 'Escreva sua mensagem...',
            backgroundColor: '#ffffff',
            textColor: '#303235',
            sendButtonColor: '#136FEE',
            maxChars: 1000,
            maxCharsWarningMessage: 'Você excedeu o número máximo de caracteres. Por favor, entre uma mensagem de até 1000 caracteres.',
            autoFocus: true,
            sendMessageSound: true,
            receiveMessageSound: true,
          },
          feedback: {
            color: '#303235',
          },
          footer: {
            textColor: '#002F6C',
            text: 'Powered by',
            company: 'StartSe',
            companyLink: 'https://startse.com',
          }
        },
      },
    });

  <flowise-menu></flowise-menu>
