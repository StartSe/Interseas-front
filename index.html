<!-- login.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Interseas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn-login {
            width: 100%;
            padding: 10px;
            background-color: #0066FF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .error-message {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="./flowise-embed/src/assets/logo.svg" alt="Interseas Logo" style="max-width: 200px; margin-bottom: 20px;" />
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required />
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required />
            </div>
            <button type="submit" class="btn-login">CONFIRMAR</button>
            <div id="errorMessage" class="error-message">
                Credenciais inválidas. Tente novamente.
            </div>
        </form>
    </div>

    <script>
        // Auth utilities
        const MENU_PAGE = 'menu.html';
        const AUTH_TOKEN_KEY = 'auth_token';

        const setAuthToken = (token) => {
            const date = new Date();
            date.setTime(date.getTime() + (60 * 1000)); // 60 seconds
            const expires = "expires=" + date.toUTCString();
            document.cookie = AUTH_TOKEN_KEY + "=" + token + ";" + expires + ";path=/";
        };

        const getAuthToken = () => {
            const name = AUTH_TOKEN_KEY + "=";
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(name) == 0) {
                    return c.substring(name.length, c.length);
                }
            }
            return null;
        };

        const isAuthenticated = () => {
            return !!getAuthToken();
        };

        // Check if user is already authenticated
        if (isAuthenticated()) {
            window.location.href = MENU_PAGE;
        }

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                // Replace with your n8n webhook URL
                const response = await fetch('https://interseas-n8n.paas.startse.com/webhook/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (data.success) {
                    setAuthToken(data.token);
                    window.location.href = MENU_PAGE;
                } else {
                    document.getElementById('errorMessage').style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('errorMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
